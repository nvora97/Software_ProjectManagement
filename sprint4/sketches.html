<!DOCTYPE html>
<html>
<head>
    <title>CampusCents</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .ux-gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }
        .ux-card {
            flex: 1 1 calc(25% - 20px);
            min-width: 220px;
            background: #ffffff;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .ux-card img {
            width: 100%;
            height: auto;
            border-radius: 6px;
            object-fit: cover;
        }
        .ux-card p {
            margin-top: 10px;
            font-weight: bold;
            color: #111111;
        }
    </style>
</head>

<body>
    <!-- Single Header / Navigation Bar -->
    <header>
        <h1>CampusCents</h1>
        <nav>
            <a href="../index.html">Home</a>
            <a href="../about.html">About Us</a>
            <a href="../sprint1.html">Sprint 1</a>
            <a href="../sprint2.html">Sprint 2</a>
            <a href="../sprint3.html">Sprint 3</a>
            <a href="../sprint4.html">Sprint 4</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>UX Designs</h2>
            
            <div class="ux-gallery">
                <div class="ux-card">
                    <img src="../documents/Sketch 1.jpg" alt="CampusCents Home Dashboard Wireframe">
                    <p>Dashboard & Safe-to-Spend</p>
                </div>
                
                <div class="ux-card">
                    <img src="../documents/Sketch 2.jpg" alt="Savings Report Wireframe">
                    <p>Savings Report & Breakdown</p>
                </div>
                
                <div class="ux-card">
                    <img src="../documents/Sketch 3.jpg" alt="Sprout AI Recommendations & Negotiator Wireframe">
                    <p>AI Recommendations & Negotiation</p>
                </div>
                
                <div class="ux-card">
                    <img src="../documents/Sketch 4.jpg" alt="Sprout AI Chat Assistant Wireframe">
                    <p>Sprout AI Chat Interface</p>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
